openapi: 3.0.3
info:
  title: Life Swap
  version: 1.0.0
  description: API for Life Swap
servers:
  - url: http://localhost:8080

paths:
  /api/v1/health:
    get:
      operationId: health
      summary: checks if the server is healthy
      tags:
        - Health
      responses:
        "200":
          description: the server is healthy
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/HealthResponse"
        "500":
          description: the server is not healthy
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

  /api/v1/counties:
    get:
      summary: Get all Romanian counties and Bucharest
      operationId: getCounties
      tags:
        - Locations
      responses:
        "200":
          description: List of all 41 Romanian counties and Bucharest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./models.yaml#/components/schemas/CountyResponse"

  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/UserResponse"
        "400":
          description: Validation error or Email already exists
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: Log in an existing user
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/UserResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

  /api/v1/users/{userId}/profile:
    get:
      summary: Get user profile, preferences, and host activities
      operationId: getUserProfile
      tags:
        - Profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/UserProfileResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

    put:
      summary: Update user profile, preferences, and host activities
      operationId: updateUserProfile
      tags:
        - Profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/UserProfileRequest"
      responses:
        "200":
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/UserProfileResponse"
        "400":
          description: Validation error (e.g. less than 3 preferences)
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

  /api/v1/homes:
    post:
      summary: Create a new home listing
      operationId: createHome
      tags:
        - Homes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/CreateHomeRequest"
      responses:
        "201":
          description: Home created successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/HomeResponse"
        "400":
          description: Invalid home details
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required

  /api/v1/homes/{homeId}:

    get:
      tags:
        - Homes
      operationId: getHomeById
      summary: Get details of a home
      security:
        - bearerAuth: []
      parameters:
        - name: homeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Home details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/HomeResponse"
        "401":
          description: Authentication required
        "404":
          description: Home not found

    put:
      tags:
        - Homes
      operationId: updateHome
      summary: Update an existing home
      security:
        - bearerAuth: []
      parameters:
        - name: homeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/CreateHomeRequest"
      responses:
        "200":
          description: Home updated successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/HomeResponse"
        "400":
          description: Invalid home details
        "401":
          description: Authentication required
        "403":
          description: Not the property owner
        "404":
          description: Home not found

    delete:
      tags:
        - Homes
      operationId: deleteHome
      summary: Delete an existing home
      security:
        - bearerAuth: []
      parameters:
        - name: homeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Home deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Not the property owner
        "404":
          description: Home not found

  /api/v1/homes/mine:
    get:
      tags:
        - Homes
      operationId: getMyHomes
      summary: Get homes owned by the authenticated user
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Homes retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './models.yaml#/components/schemas/HomeResponse'
        '401':
          description: Unauthorized

  /api/v1/homes/{homeId}/photos:
    parameters:
      - name: homeId
        in: path
        required: true
        schema:
          type: integer
          format: int64

    post:
      tags:
        - Homes
      operationId: uploadHomePhoto
      summary: Upload a photo for a home
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/HomePhotoResponse"
        "400":
          description: Invalid image or photo limit reached
        "401":
          description: Authentication required
        "403":
          description: Not the home owner
        "404":
          description: Home not found

    get:
      tags:
        - Homes
      operationId: getHomePhotos
      summary: List photos of a home
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Home photos retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./models.yaml#/components/schemas/HomePhotoResponse"
        "404":
          description: Home not found

  /api/v1/homes/{homeId}/photos/{photoId}:
    delete:
      tags:
        - Homes
      operationId: deleteHomePhoto
      summary: Delete a home photo
      security:
        - bearerAuth: []
      parameters:
        - name: homeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Photo deleted successfully
        "401":
          description: Authentication required
        "403":
          description: Not the home owner
        "404":
          description: Home or photo not found

  /api/v1/homes/{homeId}/photos/{photoId}/image:
    get:
      tags:
        - Homes
      operationId: getHomePhotoImage
      summary: Retrieve the photo image
      security:
        - bearerAuth: []
      parameters:
        - name: homeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Image file
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Photo not found

  /api/v1/homes/{homeId}/photos/{photoId}/primary:
    put:
      tags:
        - Homes
      operationId: setPrimaryHomePhoto
      summary: Set the primary photo of a home
      security:
        - bearerAuth: []
      parameters:
        - name: homeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Primary photo updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./models.yaml#/components/schemas/HomePhotoResponse"
        "401":
          description: Authentication required
        "403":
          description: Not the home owner
        "404":
          description: Home or photo not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
