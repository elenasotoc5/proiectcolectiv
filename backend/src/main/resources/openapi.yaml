openapi: 3.0.3
info:
  title: Life Swap
  version: 1.0.0
  description: API for Life Swap
servers:
  - url: http://localhost:8080

paths:
  /api/v1/health:
    get:
      operationId: health
      summary: checks if the server is healthy
      tags:
        - Health
      responses:
        "200":
          description: the server is healthy
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/HealthResponse"
        "500":
          description: the server is not healthy
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/UserResponse"
        "400":
          description: Validation error or Email already exists
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: Log in an existing user
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./models.yaml#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/UserResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "./models.yaml#/components/schemas/ErrorResponse"
