openapi: 3.0.3
info:
  title: Life Swap
  version: 1.0.0
  description: API for Life Swap
servers:
  - url: http://localhost:8080

paths:
  /api/v1/health:
    get:
      operationId: health
      summary: checks if the server is healthy
      tags:
        - Health
      responses:
        "200":
          description: the server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: the server is not healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error or Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "UP"

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "John Doe"
        email:
          type: string
          format: email
          maxLength: 255
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: "SecretPassword123!"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john.doe@example.com"
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        errorCode:
          type: integer
          format: int32
        message:
          type: string
          example: "Email is already registered"