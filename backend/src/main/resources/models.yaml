components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "UP"

    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 255
          example: "John"
        lastName:
          type: string
          minLength: 1
          maxLength: 255
          example: "Doe"
        email:
          type: string
          format: email
          maxLength: 255
          example: "john.doe@example.com"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: "SecretPassword123!"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          example: "john.doe@example.com"
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: "Email is already registered"

    ActivityDto:
      type: object
      required:
        - title
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Access to campus sports complex & gym"
        description:
          type: string
          example: "I have an active pass, you can join our indoor volleyball team on Tuesdays."
        category:
          type: string
          example: "Sports & Fitness"

    UserProfileRequest:
      type: object
      properties:
        bio:
          type: string
          example: "3rd year Computer Science student who loves specialty coffee and exploring cities."
        university:
          type: string
          example: "Babes-Bolyai University"
        fieldOfStudy:
          type: string
          example: "Computer Science"
        studyYear:
          type: integer
          example: 3
        location:
          type: string
          example: "Cluj-Napoca"
        housingType:
          type: string
          example: "Shared Student Apartment"
        avatarUrl:
          type: string
          example: "https://images.unsplash.com/photo-1534528741775-53994a69daeb"
        preferences:
          type: array
          minItems: 3
          items:
            type: string
          example: ["Quiet Study", "Coffee Shops", "Tech & Coding", "Sports & Gym"]
        activities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ActivityDto"

    UserProfileResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Doe"
        email:
          type: string
          example: "john.doe@example.com"
        bio:
          type: string
          example: "3rd year Computer Science student who loves specialty coffee."
        university:
          type: string
          example: "Babes-Bolyai University"
        fieldOfStudy:
          type: string
          example: "Computer Science"
        studyYear:
          type: integer
          example: 3
        location:
          type: string
          example: "Cluj-Napoca"
        housingType:
          type: string
          example: "Shared Student Apartment"
        avatarUrl:
          type: string
          example: "https://images.unsplash.com/photo-1534528741775-53994a69daeb"
        preferences:
          type: array
          items:
            type: string
          example: ["Quiet Study", "Coffee Shops", "Tech & Coding", "Sports & Gym"]
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityDto"
