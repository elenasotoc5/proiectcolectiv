services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    networks:
      - backend-network
    volumes:
      - postgres_data:/var/lib/postgresql

  flyway:
    image: flyway/flyway:10-alpine
    container_name: flyway_migrations
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASS}
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql
    networks:
      - backend-network
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    container_name: backend_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - backend-network
      - frontend-network
    depends_on:
      flyway:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: frontend_app
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - frontend-network
    depends_on:
      - backend

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge

volumes:
  postgres_data: